<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Консьерж-штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app — header, scrolling view, fixed bottom tab bar; sheets slide up from the bottom. */
:root{
  --bg:#F0F1EC; --surface:#FFFFFF; --ink:#1B2230; --muted:#5E6573; --line:#DADDD4;
  --accent:#8A6728; --accent-ink:#FFFFFF; --accent-soft:#F2EAD9;
  --good:#2E7A4E; --warn:#A5621A; --bad:#A33B3B;
  --display:"Prata", Georgia, "Times New Roman", serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#1A2029; --ink:#ECE8DE; --muted:#9BA1AC; --line:#2B323D;
  --accent:#CDA45C; --accent-ink:#17130B; --accent-soft:#2B2517;
  --good:#5DB687; --warn:#DB9C4C; --bad:#DD6E6E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1A2029; --ink:#ECE8DE; --muted:#9BA1AC; --line:#2B323D;
  --accent:#CDA45C; --accent-ink:#17130B; --accent-soft:#2B2517;
  --good:#5DB687; --warn:#DB9C4C; --bad:#DD6E6E; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.stage-chip{text-decoration:none;font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 10px;white-space:nowrap}

main{padding-top:18px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted)}
.notice.shabbat{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.next{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.next .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.next .txt{font-family:var(--display);font-size:21px;line-height:1.25}
.next .row{display:flex;gap:8px;flex-wrap:wrap}
.next button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font-size:14px}
.next button.fill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.meter b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}
.meter b span{color:var(--muted);font-size:13px}
.meter i{font-style:normal;font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--accent)}

.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:none;color:var(--accent);padding:4px 0;font-size:14px;font-weight:500}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .d{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.check{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px;background:none;padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.code{font-family:var(--mono);font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:none;margin-top:1px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--mono);font-weight:500;margin-left:4px}
.stage{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stage summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.stage summary::-webkit-details-marker{display:none}
.stage summary span{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px}
.stage .list{border:0;border-top:1px solid var(--line);border-radius:0}

/* agents */
.agents{display:grid;grid-template-columns:1fr;gap:10px}
.agent{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.agent .mono{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--accent-soft);color:var(--accent)}
.agent.later .mono{background:transparent;border:1px solid var(--line);color:var(--muted)}
.agent .main{flex:1;min-width:0}
.agent .t{font-weight:600}
.agent .d{font-size:13.5px;color:var(--muted)}

.chat{display:flex;flex-direction:column;gap:12px}
.chat-head{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none;padding:0}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.thinking{color:var(--muted)}
.msg .copy{display:block;margin-top:6px;background:none;border:none;color:var(--accent);font-size:12.5px;padding:0}
.composer{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:140px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px}
.composer .btn{flex:none;height:46px}
.hint{font-size:12.5px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.actions .r{display:flex;gap:8px;margin-left:auto}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Штаб<small>Консьерж · Москва</small></div>
    <a class="stage-chip" id="stageChip" href="#progress">Прогресс</a>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Разделы"><div class="in">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>Сегодня</a>
  <a href="#people" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><circle cx="17" cy="8" r="2.4"/><path d="M16 13.2c2.2 0 3.8 1.3 4.5 3.8"/></svg>Люди</a>
  <a href="#partners" data-tab="partners"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 10h16M9 14.5h6"/></svg>Исполнители</a>
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>Журнал</a>
  <a href="#agents" data-tab="agents"><svg viewBox="0 0 24 24"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V16h0a2.5 2.5 0 0 1-2-2.5z"/><path d="M9 9.5h6M9 12.5h4"/></svg>Агенты</a>
</div></nav>

<div id="sheetRoot"></div>

<script>
(() => {
// ---------- static content ----------
const NICHES = ["Редкие товары из-за границы","Ремонт и интерьер","Медицина","Авто","Юристы и документы","Недвижимость","Красота и здоровье","Образование","Другое"];
const P_STATUS = [["found","Найден",""],["check","Проверяется","warn"],["ok","Проверен","good"],["no","Отказ","bad"]];
const C_STATUS = [["none","Не обсуждали",""],["yes","Готов платить 10–15%","good"],["no","Отказался","bad"]];
const RATE = 0.10;
const L_RESULT = [["wait","Ждём результат","warn"],["good","Доволен","good"],["bad","Не доволен","bad"]];

const PLAN = [
 {id:"s1", title:"Этап 1 · Первый месяц — система", items:[
   {id:"p1", t:"Поговорить с Начальником штаба", d:"Вкладка «Агенты» — спросите, что сделать сегодня"},
   {id:"p2", t:"Записать знакомых под кодами", d:"Вкладка «Люди»: чем занимаются и какие у них задачи", count:"people", goal:20},
   {id:"p3", t:"Выбрать 2–3 ниши первой очереди", d:"Смотрите сводку ниш во вкладке «Люди»"},
   {id:"p4", t:"Решить, привлекать ли друзей", d:"Дать каждому одно пробное задание на 1–2 недели"}]},
 {id:"s2", title:"Этап 2 · Месяцы 2–3 — база и бренд", items:[
   {id:"p5", t:"Собрать базу исполнителей", d:"Вкладка «Исполнители», только Москва и выбранные ниши", count:"partners", goal:30},
   {id:"p6", t:"Придумать название и стиль", d:"Попросите Голос бренда предложить варианты"},
   {id:"p7", t:"Написать ТЗ на Telegram-бота", d:"Вместе с Техлид-ассистентом"}]},
 {id:"s3", title:"Этап 3 · До совершеннолетия — репутация", items:[
   {id:"p8", t:"Бесплатно советовать проверенных исполнителей", d:"Только когда знакомые сами просят; денег и подарков не брать", count:"log", goal:10},
   {id:"p9", t:"Записывать каждый случай в журнал", d:"Задача, кого посоветовали, чем закончилось"},
   {id:"p10", t:"Раз в месяц обновлять базу", d:"Кто держит качество, кого убрать"}]},
 {id:"s4", title:"После 18 · Запуск", items:[
   {id:"p11", t:"Регистрация самозанятым или ИП", d:""},
   {id:"p12", t:"Наём дежурного ассистента и разработчика", d:""},
   {id:"p13", t:"Договоры о комиссии с партнёрами из базы", d:""},
   {id:"p14", t:"Первые платные сделки", d:""}]}
];

const COMMON = `Общие правила для всех ответов:
— Пиши по-русски, коротко, для экрана телефона: не больше 12 строк, без таблиц и заголовков. Можно короткие списки через «—».
— Клиенты и знакомые только по кодам (К-001). Реальных имён не проси.
— Город — Москва. В Шаббат и еврейские праздники сервис не работает.
— Основатель несовершеннолетний, сейчас этап подготовки: никаких денег, договоров, комиссий, физических поручений и доставки ценностей. Если об этом заходит речь — напомни, что это после запуска со взрослыми.
— Основатель учится в ешиве и управляет со смартфона 30–40 минут в день. Каждый шаг, который предлагаешь, должен занимать 10–30 минут.`;

const AGENTS = [
 {key:"secretary", name:"Секретарь", letter:"З", desc:"Надиктуйте — запишет и разложит по базе", when:"сейчас", prompt:"", quick:[]},
 {key:"buyer", name:"Байер", letter:"Б", desc:"Поиск редких товаров из-за границы", when:"сейчас",
  prompt:`Ты — Байер-консультант: помогаешь основателю найти редкий товар из-за границы для знакомого. Модель сервиса: продаём ПОИСК, а не товар. Клиент платит продавцу или посреднику напрямую, основатель чужих денег не держит и ничего не перепродаёт. На каждый запрос: что именно ищем (до трёх уточнений: модель, размер, цвет, бюджет, срок); где такое обычно продаётся (официальные бутики, проверенные ресейл-площадки, байеры); как проверить подлинность и продавца; риски (подделки, мошенники, предоплата незнакомым, ограничения на отправку в Россию). Таможенные лимиты и правила меняются — ты их не знаешь точно, всегда говори проверить в момент покупки. Не помогай обходить санкции, таможню или налоги и не предлагай серые схемы ввоза.`,
  quick:["Знакомый ищет редкие часы — с чего начать?","Как проверить байера перед заказом?","Какие вопросы задать клиенту перед поиском?"]},
 {key:"chief", name:"Начальник штаба", letter:"Н", desc:"План, следующий шаг, сводка", when:"сейчас",
  prompt:`Ты — Начальник штаба основателя будущего закрытого консьерж-сервиса для занятых состоятельных людей. Твоя главная задача — снимать туман: всегда называй ОДИН следующий конкретный шаг, опираясь на план подготовки и данные штаба ниже. Когда просят сводку — три блока: СДЕЛАНО / СЛЕДУЮЩИЙ ШАГ / ЧТО МЕШАЕТ. Когда основатель надиктовывает дела — разложи их на короткие задачи списком, чтобы он мог внести их в «Мои задачи».`,
  quick:["Что мне сделать сегодня?","Сводка за неделю","Разбей следующий шаг на мелкие задачи"]},
 {key:"scout", name:"Скаут", letter:"С", desc:"Знакомые, ниши, база исполнителей", when:"сейчас",
  prompt:`Ты — Скаут. Помогаешь основателю понять, какие задачи у его знакомых, выбрать ниши и собрать базу проверенных премиальных исполнителей в Москве. По данным о знакомых определяй ниши и называй, каких исполнителей искать первыми. Не выдумывай конкретные компании и контакты: подсказывай, где искать, как проверять (отзывы, портфолио, годы работы, рекомендации) и какие тревожные признаки. Отмечай, где факт, а где предположение. Денег сейчас не берём, но можно узнавать у исполнителя, готов ли он платить 10–15% за клиентов, когда основатель оформит статус; лучше получить это письменно в переписке. Помогай подготовить такой короткий разговор. Если основатель называет конкретного исполнителя — предложи внести его через «Быструю запись».`,
  quick:["Какие ниши видны по моим знакомым?","Каких исполнителей искать первыми?","Чек-лист проверки исполнителя"]},
 {key:"voice", name:"Голос бренда", letter:"Г", desc:"Название, тексты, приглашения", when:"этап 2",

const TG = window.Telegram && window.Telegram.WebApp;

const cleanRec = d => { const c = {...d}; delete c.id; delete c._a; delete c._id; delete c.mine; return c; };
function lsAll(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function lsSave(a){ try { localStorage.setItem(LS_KEY, JSON.stringify(a)); } catch {} }
function loadAll(){
  return new Promise(res => {
    if (!CS) return res(lsAll());
    CS.getKeys((err, keys) => {
      if (err || !keys || !keys.length) return res({});
      const out = {}, parts = [];
      for (let i = 0; i < keys.length; i += 50) parts.push(keys.slice(i, i + 50));
      let left = parts.length;
      parts.forEach(p => CS.getItems(p, (e2, vals) => {
        if (!e2 && vals) for (const k of p){ try { if (vals[k]) out[k] = JSON.parse(vals[k]); } catch {} }
        if (--left === 0) res(out);
      }));
    });
  });
}
function fitChat(v){
  if (v.kind !== "chat") return v;
  let turns = (v.turns || []).map(t => ({role:t.role, content:String(t.content).slice(0, 1400)}));
  while (turns.length && JSON.stringify({...v, turns}).length > 3900) turns = turns.slice(2);
  return {...v, turns};
}
function storeSet(k, v){
  return new Promise((res, rej) => {
    if (!CS){ const a = lsAll(); a[k] = v; lsSave(a); return res(); }
    const str = JSON.stringify(v);
    if (str.length > 4096) return rej(new Error("Запись слишком длинная — сократите текст."));
    CS.setItem(k, str, e => e ? rej(new Error("Не удалось сохранить в Telegram. Попробуйте ещё раз.")) : res());
  });
}
function storeDel(k){ return new Promise(res => { if (!CS){ const a = lsAll(); delete a[k]; lsSave(a); return res(); } CS.removeItem(k, () => res()); }); }
async function put(id, data){

}

function parseJSON(text){
  text = String(text || "").trim();
  const f = /```(?:json)?\s*([\s\S]+?)```/.exec(text); if (f) text = f[1].trim();
  try { return JSON.parse(text); } catch {}
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a !== -1 && b > a) return JSON.parse(text.slice(a, b + 1));
  throw new Error("no json");
}

Существующие исполнители: ${partners}

{"contacts":[{"ref":"new1","role":"","needs":"","spend":"","niche":""}],"partners":[{"name":"","niche":"","why":"","who":""}],"logs":[{"contact":"К-001 или new1","task":"","partner":"","result":"wait","amount":null}],"tasks":[{"text":""}],"reply":"одна-две фразы: что записано и что стоит уточнить"}

${text.slice(0, 6000)}`;

async function importRecords(r){
  const ids = [], refs = {}, now = Date.now(); let n = 0;
  let max = 0; for (const c of mine("contact")){ const m = /(\d+)/.exec(c.code||""); if (m) max = Math.max(max, +m[1]); }
  const niche = v => NICHES.includes(v) ? v : "Другое";
  for (const c of (r && r.contacts) || []){
    if (!c || !c.role) continue; max++; const code = "К-" + String(max).padStart(3,"0"); refs[c.ref || ("new" + (++n))] = code;
    const id = "contact-" + uid(); ids.push(id);
    await put(id, {kind:"contact", code, role:String(c.role), needs:String(c.needs||""), spend:String(c.spend||""), niche:niche(c.niche), created:now});
  }
  for (const p of (r && r.partners) || []){
    if (!p || !p.name) continue; const id = "partner-" + uid(); ids.push(id);
    await put(id, {kind:"partner", name:String(p.name), niche:niche(p.niche), status:"found", why:String(p.why||""), who:String(refs[p.who]||p.who||""), contact:"", commission:"none", created:now});
  }
  for (const l of (r && r.logs) || []){
    if (!l || !l.task) continue; const id = "log-" + uid(); ids.push(id); const amt = Number(l.amount);
    await put(id, {kind:"log", date:new Date().toISOString().slice(0,10), contact:String(refs[l.contact]||l.contact||""), task:String(l.task), partner:String(l.partner||""),
      result:["wait","good","bad"].includes(l.result) ? l.result : "wait", amount: isFinite(amt) && amt > 0 ? String(Math.round(amt)) : "", note:"", created:now});
  }
  for (const t of (r && r.tasks) || []){
    if (!t || !t.text) continue; const id = "task-" + uid(); ids.push(id);
    await put(id, {kind:"task", text:String(t.text).slice(0,200), done:false, from:"Секретарь", created:now});
  }
  return ids;
}

}

const G_DEF = {people:20, partners:30, verified:10, ready:3, log:10, good:5};
function goal(k){ const v = Number(S.items.settings && S.items.settings["g_" + k]); return v > 0 ? Math.round(v) : G_DEF[k]; }
const DAY = 864e5;
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); };
const weekStart = t => { const d = new Date(t); d.setHours(0,0,0,0); const w = (d.getDay() + 6) % 7; return d.getTime() - w * DAY; };
function events(){
  const ev = [];
  for (const [id, v] of Object.entries(S.items)){
    if (!v) continue;
    if (["contact","partner","log","task"].includes(v.kind) && v.created) ev.push({t:v.created, kind:v.kind});
    if (v.kind === "task" && v.done && v.doneAt) ev.push({t:v.doneAt, kind:"done"});
  }
  const p = S.items.plan; if (p && p.at) for (const t of Object.values(p.at)) if (t) ev.push({t, kind:"done"});
  return ev;
}
function streak(ev){
  const days = new Set(ev.map(e => dayKey(e.t)));
  let n = 0, t = Date.now();
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t))){ n++; t -= DAY; }
  return n;
}
function weekBars(ev){
  const now = weekStart(Date.now()), weeks = [];
  for (let i = 7; i >= 0; i--){ const s = now - i * 7 * DAY; weeks.push({s, n: ev.filter(e => e.t >= s && e.t < s + 7 * DAY).length}); }
  const max = Math.max(4, ...weeks.map(w => w.n)), W = 320, H = 130, top = 18, base = 104, bw = 26, gap = (W - 8 * bw) / 8;
  const bars = weeks.map((w, i) => {
    const x = gap / 2 + i * (bw + gap), h = Math.round((w.n / max) * (base - top)), cur = i === 7, d = new Date(w.s);
    return `<rect x="${x}" y="${base - h}" width="${bw}" height="${Math.max(h, 1)}" rx="4" fill="${cur ? "var(--accent)" : "var(--muted)"}" fill-opacity="${cur ? 1 : 0.35}"/>
      ${w.n ? `<text x="${x + bw/2}" y="${base - h - 5}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--mono)">${w.n}</text>` : ""}
      <text x="${x + bw/2}" y="${base + 16}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getDate()}.${String(d.getMonth()+1).padStart(2,"0")}</text>`;
  }).join("");
  return {weeks, svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Действия по неделям за 8 недель"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`};
}

  </div>

  <section class="section"><h2>Эта неделя</h2>
    <div class="meters">
      <div class="meter"><b>${thisW}</b><i>${plural(thisW,"действие","действия","действий")} · ${delta === 0 ? "как на прошлой" : delta > 0 ? `+${delta} к прошлой` : `${delta} к прошлой`}</i></div>
      <div class="meter"><b>${st}</b><i>${plural(st,"день","дня","дней")} подряд</i></div>
      <div class="meter"><b>${rub(pr.fee).replace(" ₽","")}<span> ₽</span></b><i>упущенная комиссия</i></div>

    <div class="list">${ready.map(([l, v, g]) => `
      <div class="item"><div class="main" style="gap:6px"><span class="t" style="display:flex;justify-content:space-between;gap:8px"><span>${l}</span><span style="font-family:var(--mono);font-weight:500">${v}/${g}</span></span>
        <div class="bar"><div style="width:${Math.min(100, v / g * 100)}%"></div></div></div></div>`).join("")}</div>
  </section>

  <section class="section"><h2>Где спрос, а где нет исполнителей</h2>
    ${gaps.length ? `<div class="list">${gaps.map(([n, x]) => `
      <div class="item"><div class="main"><span class="t">${esc(n)}</span><span class="d">${x.c} ${plural(x.c,"знакомый","знакомых","знакомых")} · проверено ${x.v} · на проверке ${x.f}</span></div>
        ${x.v ? `<span class="pill good">Закрыто</span>` : `<span class="pill warn">Ищите</span>`}</div>`).join("")}</div>
      <p class="hint">«Ищите» — у знакомых есть задачи в этой нише, а проверенного исполнителя пока нет. Это первое, на что тратить время.</p>`
    : `<div class="empty">Здесь появится карта спроса, когда вы запишете первых знакомых.</div>`}
  </section>

  ${teamSection()}
  <button class="btn" data-act="week-review">Разбор недели с Начальником штаба</button>`;
}

function shareRecord(rec){
  const data = cleanRec(rec); delete data.created; if (data.kind === "contact") delete data.code;
  const human = data.kind === "partner" ? `Исполнитель: ${data.name}${data.niche ? ` (${data.niche})` : ""}${data.why ? `\n${data.why}` : ""}`
    : data.kind === "contact" ? `Знакомый: ${data.role || ""}${data.needs ? ` — ${data.needs}` : ""}`
    : `Совет: ${data.task || ""}${data.partner ? ` → ${data.partner}` : ""}`;
  const text = `${human}\n\nДля штаба: #штаб ${b64e(JSON.stringify(data))}`;
  const link = "https://t.me/share/url?url=" + encodeURIComponent(location.origin + location.pathname) + "&text=" + encodeURIComponent(text);
  try { if (TG && TG.openTelegramLink) TG.openTelegramLink(link); else window.open(link, "_blank"); }
  catch { copyText(text); showNotice("Сообщение скопировано — вставьте его в чат с другом."); }
}
async function importShared(){
  const txt = ($("#importBox") || {}).value || "";
  const found = [...txt.matchAll(/#штаб\s+([A-Za-z0-9+/=]+)/g)];
  if (!found.length){ showNotice("В сообщении нет записей штаба. Скопируйте его целиком."); return; }
  let n = 0;
  for (const m of found){
    try {
      const d = JSON.parse(b64d(m[1])); if (!REC.includes(d.kind)) continue;
      const rec = {...d, created:Date.now(), fromFriend:true};
      if (d.kind === "contact") rec.code = nextCode();
      if (d.kind === "partner"){ rec.status = rec.status || "found"; rec.who = "от друга"; }
      await put(d.kind + "-" + uid(), rec); n++;
    } catch {}
  }
  showNotice(n ? `Добавлено записей: ${n}.` : "Не получилось прочитать записи из сообщения.");
}
function proof(){
  const logs = all("log"), good = logs.filter(l => l.result === "good");
  const sum = good.reduce((s,l) => s + (Number(l.amount) || 0), 0);
  const ready = all("partner").filter(p => p.commission === "yes").length;
  return {done: good.length, sum, fee: Math.round(sum * RATE), ready};
}

// ---------- forms ----------
const FORMS = {
  settings: {title:"Цели и дата запуска", fields:[["launch","Дата вашего 18-летия","date",""],["g_people","Цель: знакомых записать","number","20"],["g_partners","Цель: исполнителей в базе","number","30"],["g_verified","Цель: проверенных исполнителей","number","10"],["g_ready","Цель: готовы платить комиссию","number","3"],["g_log","Цель: советов знакомым","number","10"],["g_good","Цель: удачных советов","number","5"]]},
  task: {title:"Задача", fields:[["text","Что сделать","textarea",""]]},
  contact: {title:"Знакомый", fields:[["code","Код","text",""],["role","Чем занимается","text","Например: владелец автосервиса"],
    ["needs","Какие задачи у него возникают","textarea","С чем обращался за советом, что ищет"],["spend","На что тратит много времени или денег","textarea",""],
    ["niche","Ниша","select",NICHES]]},
  partner: {title:"Исполнитель", fields:[["name","Название или имя мастера","text",""],["niche","Ниша","select",NICHES],
    ["status","Статус","select",P_STATUS.map(x=>[x[0],x[1]])],["who","Кто рекомендовал","text","Код знакомого или «сам знаю»"],
    ["contact","Где найти","text","Сайт, Telegram, адрес"],["why","Почему доверяем · что смущает","textarea",""],
    ["commission","Комиссия после оформления","select",C_STATUS.map(x=>[x[0],x[1]])]]},
  log: {title:"Совет знакомому", fields:[["date","Дата","date",""],["contact","Кто просил","contactSelect",""],["task","Что нужно было","textarea",""],
    ["partner","Кого посоветовали","partnerSelect",""],["result","Чем закончилось","select",L_RESULT.map(x=>[x[0],x[1]])],
    ["amount","Сумма заказа, ₽ (примерно)","number","Спросите у знакомого или исполнителя"],["note","Заметка","textarea",""]]}
};
function openForm(kind, id){
  const f = FORMS[kind], rec = getRec(id), cur = rec ? cleanRec(rec) : {};
  const ro = !!(id && id.includes("~") && !S.owner);
  if (!id){
    if (kind === "contact") cur.code = nextCode();
    if (kind === "log") cur.date = new Date().toISOString().slice(0,10);
  }
  const fld = ([k,label,type,ph]) => {
    const v = cur[k] ?? "";
    let input;
    if (type === "textarea") input = `<textarea id="f-${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
    else if (type === "select") input = `<select id="f-${k}">${ph.map(o => { const [val,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${val===v?"selected":""}>${esc(l)}</option>`; }).join("")}</select>`;
    else if (type === "contactSelect") input = `<select id="f-${k}"><option value="">—</option>${mine("contact").map(c=>`<option value="${esc(c.code)}" ${c.code===v?"selected":""}>${esc(c.code)} · ${esc(c.role||"")}</option>`).join("")}</select>`;
    else if (type === "partnerSelect") input = `<input id="f-${k}" list="plist" value="${esc(v)}" placeholder="Из базы или новый"><datalist id="plist">${all("partner").map(p=>`<option value="${esc(p.name)}"></option>`).join("")}</datalist>`;
    else input = `<input id="f-${k}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}">`;
    return `<div class="field"><label for="f-${k}">${esc(label)}</label>${input}</div>`;
  };
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="sheet-close"><form class="sheet" id="sheetForm" role="dialog" aria-label="${esc(f.title)}">
    <h3>${id ? "" : "Новый · "}${esc(f.title).toLowerCase()}</h3>
    ${id && id.includes("~") ? `<p class="hint">Запись от: ${esc(who(id.split("~")[0]))}${ro ? " · только просмотр" : ""}</p>` : ""}
    ${f.fields.map(fld).join("")}
    <div class="actions">
      ${id && kind !== "settings" && !ro ? `<button type="button" class="btn danger" id="delBtn">Удалить</button>` : ""}
      ${id && REC.includes(kind) ? `<button type="button" class="btn ghost" id="shareBtn">Поделиться</button>` : ""}
      <div class="r"><button type="button" class="btn ghost" data-act="sheet-close">${ro ? "Закрыть" : "Отмена"}</button>${ro ? "" : `<button type="submit" class="btn">Сохранить</button>`}</div>
    </div></form></div>`;
  const form = $("#sheetForm");
  if (ro) form.querySelectorAll("input,select,textarea").forEach(el => el.disabled = true);
  setTimeout(()=>{ const first = form.querySelector("textarea,input:not([type=date])"); if (first && !id) first.focus(); }, 50);
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (ro) return;
    const out = {...cur, kind};
    for (const [k] of f.fields) out[k] = $("#f-"+k).value.trim();
    const must = {task:"text", contact:"role", partner:"name", log:"task", settings:null}[kind];
    if (must && !out[must]){ $("#f-"+must).focus(); $("#f-"+must).placeholder = "Заполните это поле"; return; }
    if (!out.created) out.created = Date.now();
    closeSheet(); put(id || kind + "-" + uid(), out);
  });
  const sb = $("#shareBtn"); if (sb) sb.addEventListener("click", () => shareRecord({...cur, kind}));
  const db = $("#delBtn");
  if (db) db.addEventListener("click", () => {
    if (db.dataset.sure){ closeSheet(); del(id); return; }
    db.dataset.sure = "1"; db.textContent = "Точно удалить?";
  });
}
function closeSheet(){ $("#sheetRoot").innerHTML = ""; }

// ---------- agents ----------
function contextText(){
  const done = planDone(), c = counts();
  const plan = PLAN.map(s => s.title + ":\n" + s.items.map(i => `  [${done[i.id]?"x":" "}] ${i.t}${i.count?` (${c[i.count]}/${goal(i.count)})`:""}`).join("\n")).join("\n");
  const people = all("contact").map(x => `${x.code}${x.mine?"":` [от ${who(x._a)}]`} · ${x.role||""} · задачи: ${x.needs||"—"} · тратит на: ${x.spend||"—"} · ниша: ${x.niche||"—"}`).join("\n") || "пока нет";
  const partners = all("partner").map(p => `${p.name}${p.mine?"":` [от ${who(p._a)}]`} · ${p.niche||""} · ${(P_STATUS.find(s=>s[0]===(p.status||"found"))||[])[1]} · комиссия: ${(C_STATUS.find(s=>s[0]===(p.commission||"none"))||[])[1]} · ${p.why||""}`).join("\n") || "пока нет";
  const log = all("log").slice(0,15).map(l => `${l.date||""} ${l.contact||""}: ${l.task} → ${l.partner||"—"} (${(L_RESULT.find(r=>r[0]===(l.result||"wait"))||[])[1]}${l.amount?`, заказ ~${l.amount} ₽`:""})`).join("\n") || "пока нет";
  const pr = proof();
  const proofLine = `ДОКАЗАТЕЛЬСТВО: удачных советов ${pr.done}, заказов на ${pr.sum} ₽, упущенная комиссия ~${pr.fee} ₽, исполнителей готовы платить: ${pr.ready}`;
  const tasks = all("task").filter(t=>!t.done).map(t => "— " + t.text).join("\n") || "нет";
  const lch = S.items.settings && S.items.settings.launch;
  return (`ДАННЫЕ ШТАБА на ${new Date().toLocaleDateString("ru-RU")}${lch ? ` (запуск — 18-летие основателя — ${lch})` : ""}:\n\nПЛАН ПОДГОТОВКИ:\n${plan}\n\nОТКРЫТЫЕ ЗАДАЧИ:\n${tasks}\n\nЗНАКОМЫЕ (${c.people}):\n${people}\n\nИСПОЛНИТЕЛИ (${c.partners}):\n${partners}\n\nЖУРНАЛ СОВЕТОВ:\n${log}\n\n${proofLine}`).slice(0, 14000);
}
function agentPrompt(a, q){
  const prev = chatTurns(a.key).slice(-6).map(t => (t.role === "user" ? "Основатель: " : "Ты: ") + t.content).join("\n\n");
  return `${a.prompt}\n\n${COMMON}\n\n${contextText()}${prev ? `\n\nПРЕДЫДУЩИЙ РАЗГОВОР:\n${prev}` : ""}\n\nВОПРОС ОСНОВАТЕЛЯ:\n${q}`;
}
async function ask(q){
  const a = AGENTS.find(x => x.key === S.chatKey);
  q = String(q || "").trim(); if (!q) return;
  const prompt = agentPrompt(a, q);
  const copied = await copyText(prompt);
  S.draft = ""; S.chatAnswer = ""; S.awaiting = {key:a.key, q, prompt, copied}; render(); scrollChat();
  if (copied) openGiga();
}
async function saveAnswer(){
  const A = S.awaiting; if (!A) return;
  const text = (($("#chatAnswer") || {}).value || S.chatAnswer || "").trim();
  if (!text){ showNotice("Вставьте ответ GigaChat в поле."); return; }
  const turns = [...chatTurns(A.key), {role:"user", content:A.q}, {role:"assistant", content:text}].slice(-30);
  S.awaiting = null; S.chatAnswer = "";
  await put("chat-" + A.key, {kind:"chat", turns, updated:Date.now()});
  render(); scrollChat();
}
function scrollChat(){ const m = $("#msgs"); if (m) m.lastElementChild?.scrollIntoView({block:"end"}); }

// ---------- render ----------
function render(){
  const tab = S.tab;
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#stageChip").textContent = "Прогресс · " + currentStage().title.split("·")[0].trim();
  // keep the chat draft when a snapshot re-renders
  const ta = $("#ask"); if (ta) S.draft = ta.value;
  const ib = $("#inboxText"); if (ib) S.inboxDraft = ib.value;
  const banner = S.mode === "local" ? `<div class="notice">Штаб открыт вне Telegram — записи сохраняются только в этом браузере. Откройте его через своего бота, чтобы они хранились в Telegram.</div>`
    : S.mode === "loading" ? `<div class="notice">Загружаю штаб…</div>` : "";
  const flash = S.flash ? `<div class="notice shabbat">${esc(S.flash)}</div>` : "";
  const v = {today:viewToday, people:viewPeople, partners:viewPartners, log:viewLog, agents:viewAgents, progress:viewProgress}[tab] || viewToday;
  $("#view").innerHTML = flash + banner + v();
  const t2 = $("#ask"); if (t2 && document.activeElement !== t2 && S.refocus){ t2.focus(); S.refocus = false; }
}

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "sheet-close"){ if (e.target === b || b.tagName === "BUTTON") closeSheet(); return; }
  if (act === "add") openForm(b.dataset.kind);
  else if (act === "edit") openForm(b.dataset.kind, b.dataset.id);
  else if (act === "plan-toggle"){ const p = S.items.plan || {}; const d = {...(p.done||{})}, at = {...(p.at||{})}; const k = b.dataset.id;
    d[k] = !d[k]; if (d[k]) at[k] = Date.now(); else delete at[k]; put("plan", {kind:"plan", done:d, at}); }
  else if (act === "task-toggle"){ const t = S.items[b.dataset.id]; if (t) put(b.dataset.id, {...t, done:!t.done, doneAt: !t.done ? Date.now() : null}); }
  else if (act === "set-mode"){ setMode(Number(b.dataset.v)); }
  else if (act === "set-launch"){ openForm("settings", "settings"); }
  else if (act === "week-review"){ location.hash = "#agents"; S.chatKey = "chief"; S.tab = "agents"; render();
    ask("Сделай разбор моей недели по данным штаба: что получилось, где я буксую, и один главный фокус на следующую неделю."); }
  else if (act === "niche"){ S.peopleNiche = b.dataset.v || null; render(); }
  else if (act === "pfilter"){ S.partnerFilter = b.dataset.v || null; render(); }
  else if (act === "open-agent"){ S.chatKey = b.dataset.key; S.draft = ""; render(); scrollChat(); }
  else if (act === "close-agent"){ S.chatKey = null; render(); }
  else if (act === "ask-next"){ const n = nextStep(); location.hash = "#agents"; S.chatKey = "chief"; S.tab = "agents"; render();
    ask(n ? `Мой следующий шаг по плану: «${n.it.t}». Как сделать его сегодня за 20–30 минут? Разбей на 3 простых действия.` : "Что мне делать дальше?"); }
  else if (act === "quick"){ ask(b.dataset.q); }
  else if (act === "inbox-run"){ runInbox(); }
  else if (act === "inbox-import"){ importInbox(); }
  else if (act === "inbox-cancel"){ S.inbox = {}; S.inboxAnswer = ""; render(); }
  else if (act === "giga-open"){ openGiga(); }
  else if (act === "giga-copy"){ const src = b.dataset.src === "inbox" ? S.inbox : S.awaiting; if (!src) return;
    copyText(src.prompt).then(ok => { if (ok){ src.copied = true; showNotice("Задание скопировано — вставьте его в GigaChat."); } else { src.copied = false; render(); } }); }
  else if (act === "chat-save"){ saveAnswer(); }
  else if (act === "chat-cancel"){ S.awaiting = null; S.chatAnswer = ""; render(); }
  else if (act === "import-shared"){ importShared(); }
  else if (act === "inbox-undo"){ undoInbox(); }
  else if (act === "go-inbox"){ S.chatKey = null; if (location.hash !== "#today") location.hash = "#today"; else render();
    setTimeout(() => { const t = $("#inboxText"); if (t){ t.scrollIntoView({block:"center"}); t.focus(); } }, 80); }
  else if (act === "send"){ const ta = $("#ask"); ask(ta.value); }
  else if (act === "stop"){ S.ctl?.abort(); }
  else if (act === "clear-chat"){
    if (b.dataset.sure){ put("chat-" + S.chatKey, {kind:"chat", turns:[], updated:Date.now()}); }
    else { b.dataset.sure = "1"; b.textContent = "Точно очистить?"; }
  }
  else if (act === "copy"){
    const t = chatTurns(S.chatKey)[+b.dataset.i]; if (!t) return;
    const done = () => { b.textContent = "Скопировано"; setTimeout(()=> b.textContent = "Скопировать", 1500); };
    try { navigator.clipboard.writeText(t.content).then(done, () => selectText(b.parentElement)); } catch { selectText(b.parentElement); }
  }
});
function selectText(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener("input", e => {
  if (e.target.id === "inboxText") S.inboxDraft = e.target.value;
  if (e.target.id === "inboxAnswer") S.inboxAnswer = e.target.value;
  if (e.target.id === "chatAnswer") S.chatAnswer = e.target.value;
  if (e.target.id === "ask"){ S.draft = e.target.value; e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet();
});
function route(){
  const h = (location.hash || "#today").slice(1);
  S.tab = ["today","people","partners","log","agents","progress"].includes(h) ? h : "today";
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

// ---------- boot ----------
if (TG){
  try { TG.ready(); TG.expand(); } catch {}
  const th = () => { document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light"; };
  th(); try { TG.onEvent("themeChanged", th); } catch {}
}
route();
loadAll().then(items => { S.items = items || {}; S.mode = CS ? "live" : "local"; render(); });
})();
</script>

</body>
</html>
